stages:
  - 1_teacher:
    status: trained
    checkpoint: models/checkpoints/ds_cnn_l_12class.pt
    val_acc: 0.9778206364513018
config:
  data_config: configs/data/speech_commands_v2.yaml
  report_path: reports/pipeline/pipeline.yaml
  teacher:
    model_config: configs/model/ds_cnn_l.yaml
    train_config: configs/train/full.yaml
    checkpoint: models/checkpoints/ds_cnn_l_12class.pt
  student:
    model_config: configs/model/ds_cnn_xs.yaml
    train_config: configs/train/distill_imc.yaml
    checkpoint: models/checkpoints/ds_cnn_xs_distilled_warm_12class.pt
    warm_start_checkpoint: models/checkpoints/ds_cnn_xs_12class.pt
  sparsity:
    train_config: configs/train/dendritic_cycle1.yaml
    search_config: configs/train/dendritic_prune_loop.yaml
    select_by: deployed_params
  cluster:
    train_config: configs/train/cluster.yaml
    checkpoint: models/exported/kws_clustered.pt
    bits: 4
    min_weights: 64
    kmeans_iterations: 30
  quantize:
    train_config: configs/train/qat.yaml
    checkpoint: models/exported/kws_int8_qad.pt
  benchmark:
    target: onnxruntime-cpu
    torchscript_target: torchscript-cpu
    onnx_path: models/exported/kws_deployed.onnx
    report_path: reports/pipeline/benchmark.json
    split: testing
    latency_iterations: 200
    bits_per_weight: 8
