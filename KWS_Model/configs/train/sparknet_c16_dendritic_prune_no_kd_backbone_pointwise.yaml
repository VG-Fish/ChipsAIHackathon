# SparkNet C16 (paper replication) -> C12/C10/C8 prune/PAI experiment,
# backbone POINTWISE perforation.
#
# Identical to sparknet_c16_dendritic_prune_no_kd.yaml in every respect except
# perforatedai.module_ids -- same 40-epoch prune fine-tune, same 130-epoch
# dendritic horizon, same search budget and thresholds -- so this arm and the
# .fc arm differ only in where the dendrite goes. Two things differ from
# sparknet_dendritic_prune_no_kd.yaml, both forced by the source.
#
# 1. The data config is the paper one the C16 checkpoints were trained on
#    (1x unknown/silence, ceil sizing, materialized silence). Fine-tuning on
#    the 2x-balanced default would change the class prior underneath the model.
# 2. task_loss_scale: 100. sparknet_c16_paper.yaml carries sparsity_weight: 1.0
#    against the paper's 100 * CE + 1 * gate_sparsity, whereas sparknet_c12.yaml
#    folds the same 100:1 ratio into sparsity_weight: 0.01 at task scale 1.
#    Omitting it here would fine-tune at 1:1 and crush the learned gates.
#
# Placement rationale. The .fc and .gate_conv arms both sit at or past the gate
# bottleneck: .fc reads 32 mean-pooled scalars, and gate_conv is the single 1x1
# layer above them. The untested hypothesis is that a dendrite belongs in the
# TCS backbone instead -- that is where structured pruning actually removed
# capacity, and a dendrite there sees a full time-resolved (C, T) tensor rather
# than 32 numbers that have already been averaged over time.
#
# This arm is the CROSS-CHANNEL half of that test. The two 1x1 pointwise convs
# are the only cross-channel mixing in a TCS block, which is precisely what
# narrowing C16 -> C12/C10/C8 takes away, so this placement maps directly onto
# what pruning removed. It is also the cheap half: at C12 each of
# .blocks.3.pointwise and .blocks.2.pointwise is 12x12 = 144 parameters against
# .fc's 396. Run this variant before the depthwise one.
#
# The depthwise arm is kept in a separate config rather than merged into one
# module_ids list, because it tests temporal receptive field rather than
# channel mixing; combining them would confound the two.
augment: true
augmentation:
  time_shift_ms: 100
  time_shift_mode: zero_fill
  time_shift_probability: 0.8
  speed_factor_range: null
  background_noise_probability: 0.0
  white_noise_probability: 0.8
  white_noise_db_range: [-90, -46]
  white_noise_integer_db: true
  spec_augment: false
epochs: 40
dendritic_schedule_epochs: 130
batch_size: 256
num_workers: 6
persistent_workers: true
prefetch_factor: 2
cache_features: true
cache_train_features: false
lr: 0.001
weight_decay: 0.0001
label_smoothing: 0.1
warmup_fraction: 0.05
task_loss_scale: 100.0
seed: 0

# Adapt the active base parameters to the selected dendrites without a teacher.
resume_epochs: 8

objective:
  metric: validation_accuracy
  use_test: false

deployment:
  bits_per_weight: 8
  latency_iterations: 50
  profile_device: cpu

# The runner overwrites keep_ratio/target_channels per candidate.
pruning:
  kind: structured
  method: l1_filter
  keep_ratio: 0.5
  target_channels: 8

# Eight-epoch history window, backbone pointwise perforation, one dendrite.
#
# Search budget. This placement has no completed matched sweep yet. One branch
# is used to isolate placement and bound cost; at C12 the two copied pointwise
# modules total 288 parameters before PAI's residual scale terms. The positive
# threshold schedule avoids accepting a branch with no measured validation
# improvement.
#
# Placement is the one thing this file changes against the .fc arm; the history
# window, switch schedule and search budget are carried over verbatim.
#
# Caveat: this changes the recipe. The completed three-dendrite results under
# outputs/ were produced by the previous max_dendrites: 3 with
# improvement_threshold: [0.001, 0.0001, 0.0], not by what is written here.
perforatedai:
  testing_dendrite_capacity: false
  max_dendrites: 1
  switch_mode: history
  history_lookback: 8
  n_epochs_to_switch: 25
  improvement_threshold: [0.005, 0.002, 0.001]
  candidate_weight_initialization_multiplier: 0.01
  initial_correlation_batches: 40
  max_dendrite_tries: 3
  forward_function: tanh
  conversion: module_ids
  module_ids: [.blocks.3.pointwise, .blocks.2.pointwise]
  post_integration_lr_multiplier: 0.25
  enforce_base_weight_freeze: false
  freeze_base_batchnorm_in_dendrite_phase: true
