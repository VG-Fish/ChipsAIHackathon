# Framework step 3 for one sparsity target: prune the student, KD fine-tune it,
# run the perforation/dendrite phase, resume KD fine-tuning, and record cost.
#
# Each candidate starts from the warm-distilled XS checkpoint and is
# structurally pruned to the width the sweep is testing. Both complete
# depthwise-separable blocks and the classifier are perforated; the stem is
# left alone. PAI's capacity check measured one deployed dendrite on the
# width-18 base at 2,946 parameters.
augment: true
epochs: 40
# The PAI loop is dynamically terminated and recorded runs take longer than
# the pre-finetune budget. This is the intended cosine horizon; the scheduler
# clamps after it rather than oscillating if PAI runs longer.
dendritic_schedule_epochs: 130
batch_size: 128
num_workers: 4
persistent_workers: true
prefetch_factor: 2
lr: 0.001
weight_decay: 0.0001
label_smoothing: 0.1
warmup_fraction: 0.05
seed: 0

# Step 3d: epochs of KD fine-tuning on the clean deployment graph after the
# dendrites are selected and frozen. Set to 0 to skip the resume phase.
resume_epochs: 8

objective:
  metric: validation_accuracy
  minimum: 0.85
  minimize: deployed_parameters

# The KD term used inside the dendrite cycle and in the step-3d resume. Feature
# distillation is used when the wrapped model still exposes pooled features and
# is renormalized away when it does not.
distillation:
  temperature: 1.0
  feature_weight: 0.3
  response_weight: 0.1
  classification_weight: 0.6

pruning:
  kind: structured
  keep_ratio: 0.45

# Step 3e: how the deployment cost is measured for the Pareto comparison.
deployment:
  bits_per_weight: 8
  latency_iterations: 50
  profile_device: cpu

perforatedai:
  testing_dendrite_capacity: false
  max_dendrites: 1
  n_epochs_to_switch: 25
  improvement_threshold: [0.001, 0.0001, 0.0]
  candidate_weight_initialization_multiplier: 0.01
  initial_correlation_batches: 40
  max_dendrite_tries: 2
  forward_function: tanh
  conversion: blocks_and_linear
  # Step 3c requires the base weights to hold still while candidate dendrites
  # are scored.
  #
  # This MUST stay false. The original comment here claimed "PAI freezes them
  # itself; this re-asserts it" -- that premise was false and cost a 2h run.
  # PAI never sets requires_grad=False on base parameters (every
  # requires_grad_(False) in modules_perforatedai is on dendrites_to_top); it
  # keeps the base out of the optimizer instead, via set_optimizer_instance ->
  # setup_optimizer_pb.  Base parameters therefore must KEEP requires_grad=True
  # during the dendrite phase, because PAI registers its neuron-error hook as
  #     if out.requires_grad and (...): out.register_hook(filter_backward)
  # (modules_perforatedai.py:14927).  Freezing the base leaves .blocks.0's
  # output with no grad_fn, the hook never registers, no neuron errors are ever
  # recorded, and PAI's correlation counter sits at 0 until it trips its guard
  # and calls pdb.set_trace().  See ERRORS.md entry 5.
  enforce_base_weight_freeze: false
  # The base still must not drift.  Gradients are handled by PAI's optimizer
  # filter, but BatchNorm running statistics update in forward() and no
  # optimizer filter can stop them, so they are pinned separately -- see
  # freeze_base_batchnorm_stats in dendritic.py.
  freeze_base_batchnorm_in_dendrite_phase: true
