# M1 sanity-check config: no augmentation, just confirm data+model+training loop are wired correctly.
augment: false
epochs: 15
# 256 fits the feature tensor + DS-CNN comfortably on the training host and
# halves the number of optimizer/data-loader steps per epoch.
batch_size: 256
num_workers: 4
persistent_workers: true
prefetch_factor: 2
# Cache deterministic features for all three splits.  Augmented training uses
# a separate opt-in because fixed augmented views trade diversity for speed.
cache_features: true
lr: 0.001
weight_decay: 0.0001
label_smoothing: 0.1
warmup_fraction: 0.05
seed: 0
