# SparkNet C12 -> C10/C8/C6 prune/PAI experiment. The 40-epoch prune
# fine-tune follows the existing dendritic-cycle horizon while preserving the
# Phase-B winner's AdamW, augmentation, label smoothing, and cosine schedule.
augment: true
augmentation:
  time_shift_ms: 100
  time_shift_mode: zero_fill
  time_shift_probability: 0.8
  speed_factor_range: null
  background_noise_probability: 0.0
  white_noise_probability: 0.8
  white_noise_db_range: [-90, -46]
  spec_augment: false
epochs: 40
dendritic_schedule_epochs: 130
batch_size: 256
num_workers: 6
persistent_workers: true
prefetch_factor: 2
cache_features: true
cache_train_features: false
lr: 0.001
weight_decay: 0.0001
label_smoothing: 0.1
warmup_fraction: 0.05
seed: 0

# Adapt the active base parameters to the selected dendrites without a teacher.
resume_epochs: 8

objective:
  metric: validation_accuracy
  use_test: false

deployment:
  bits_per_weight: 8
  latency_iterations: 50
  profile_device: cpu

# The runner overwrites keep_ratio/target_channels per candidate.
pruning:
  kind: structured
  method: l1_filter
  keep_ratio: 0.5
  target_channels: 6

# Use the slides' eight-epoch history window. This focused continuation only
# perforates the classifier and caps the search at three dendrites.
perforatedai:
  testing_dendrite_capacity: false
  max_dendrites: 3
  switch_mode: history
  history_lookback: 8
  n_epochs_to_switch: 25
  improvement_threshold: [0.001, 0.0001, 0.0]
  candidate_weight_initialization_multiplier: 0.01
  initial_correlation_batches: 40
  max_dendrite_tries: 3
  forward_function: tanh
  conversion: module_ids
  module_ids: [.fc]
  post_integration_lr_multiplier: 0.25
  enforce_base_weight_freeze: false
  freeze_base_batchnorm_in_dendrite_phase: true
