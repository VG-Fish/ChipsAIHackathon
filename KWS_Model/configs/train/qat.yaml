# Framework step 5: quantization-aware distillation fine-tuning.
# The loss is task + KD from the fixed teacher, evaluated through a
# fake-quantized forward pass, so the weights land where int8 can represent
# them instead of being rounded there afterwards.
augment: true
epochs: 10
batch_size: 128
num_workers: 4
persistent_workers: true
prefetch_factor: 2
lr: 0.0001
weight_decay: 0.0001
label_smoothing: 0.1
warmup_fraction: 0.0
seed: 0

distillation:
  temperature: 1.0
  feature_weight: 0.3
  response_weight: 0.1
  classification_weight: 0.6
