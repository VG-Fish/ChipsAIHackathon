# Phase B light recipe (configs/train/light.yaml) plus response and
# classification KD from the fixed teacher. Keep the two files identical above
# the distillation block.
augment: true
augmentation:
  time_shift_ms: 100
  time_shift_mode: zero_fill
  time_shift_probability: 0.8
  speed_factor_range: null
  background_noise_probability: 0.0
  white_noise_probability: 0.8
  white_noise_db_range: [-90, -46]
  spec_augment: false
epochs: 200
batch_size: 256
# Uncached augmented training does its feature extraction in the workers.
num_workers: 6
persistent_workers: true
prefetch_factor: 2
cache_features: true
cache_train_features: false
lr: 0.001
weight_decay: 0.0001
label_smoothing: 0.1
warmup_fraction: 0.05
seed: 0

# Response and classification KD only, sharing the 40-bin log-mel input.
# The former T=1, 1/7 response / 6/7 CE recipe added a weak, largely redundant
# logit gradient on paired training-view diagnostics (see PLAN.md). T=2 and
# equal weights strengthen the response signal; this is an experiment, not
# evidence of an accuracy gain. Keep label smoothing and augmentation fixed.
distillation:
  temperature: 2.0
  feature_weight: 0.0
  response_weight: 0.5
  classification_weight: 0.5
