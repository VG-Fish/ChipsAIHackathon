# Phase B light recipe (PLAN.md Findings 5 and 6), shared by SparkNet and
# DS-CNN students so architecture comparisons use identical training.
# It approximates the SparkNet reference augmentation on this project's
# optimizer: +/-100 ms zero-fill shift and -90 to -46 dB white noise, each with
# probability 0.8, no background-noise mixing, no speed perturbation, and no
# SpecAugment. Training features are not cached, so every epoch draws a fresh
# augmentation. AdamW is kept; the reference SGD numbers do not carry over
# without Finding 4's x100 rescaling.
augment: true
augmentation:
  time_shift_ms: 100
  time_shift_mode: zero_fill
  time_shift_probability: 0.8
  speed_factor_range: null
  background_noise_probability: 0.0
  white_noise_probability: 0.8
  white_noise_db_range: [-90, -46]
  spec_augment: false
epochs: 200
batch_size: 256
# Uncached augmented training does its feature extraction in the workers.
num_workers: 6
persistent_workers: true
prefetch_factor: 2
cache_features: true
cache_train_features: false
lr: 0.001
weight_decay: 0.0001
label_smoothing: 0.1
warmup_fraction: 0.05
seed: 0
