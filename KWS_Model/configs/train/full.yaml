# M-series full training config: augmentation + full LR schedule. Used for the
# framework's step-1 teacher (DS-CNN-L/M) and for the independently trained XS
# that warm-starts the step-2 student.
augment: true
epochs: 200
batch_size: 256
num_workers: 4
persistent_workers: true
prefetch_factor: 2
cache_features: true
cache_train_features: true
lr: 0.001
weight_decay: 0.0001
label_smoothing: 0.1
warmup_fraction: 0.05
seed: 0
