# The SparkNet paper recipe (sparknet_narrow_paper_fast_io.yaml) with
# task_loss_scale 100 -> 10, for the BN-free ei_conv1d and dnn families.
#
# Why: 100 * CE at lr 0.01 is an effective lr of 1.0. SparkNet survives that
# because every conv is followed by BatchNorm and its head is a global-pool
# fc. The EI Conv1d model has no BN and a Flatten -> Dense head with fan-in
# c2 * 26; at scale 100 every ReLU died within the first epoch (2-epoch smoke
# of ei_c8x16: val_acc 0.08 = chance, second conv 0% active, one class
# predicted). A 6-epoch probe (SGD, momentum 0.9, no warmup) reached 0.65 at
# scale 10 with CMVN input, 0.19 at scale 30, chance at 100 (also chance at
# 100 with BatchNorm enabled). Every other number is unchanged.
augment: true
augmentation:
  time_shift_ms: 100
  time_shift_mode: zero_fill
  time_shift_probability: 0.8
  speed_factor_range: null
  background_noise_probability: 0.0
  white_noise_probability: 0.8
  white_noise_db_range: [-90, -46]
  # NeMo's WhiteNoisePerturbation draws randint(min, max): whole decibels,
  # upper bound excluded.
  white_noise_integer_db: true
  spec_augment: false
epochs: 200
batch_size: 128
num_workers: 8
persistent_workers: true
prefetch_factor: 2
# Validation features are deterministic, so caching them is a pure saving.
# Training features are NOT cached: time shift and white noise are waveform
# augmentations, and a cached train tensor would freeze them.
cache_features: true
cache_train_features: false
optimizer: sgd
momentum: 0.9
lr: 0.01
weight_decay: 0.001
label_smoothing: 0.0
task_loss_scale: 10.0
scheduler: polynomial_hold
warmup_fraction: 0.05
hold_fraction: 0.40
# Section 3 says the LR then decays over "the remaining 85%", which cannot
# hold alongside its own 5% warmup and 40% hold. NeMo's
# PolynomialHoldDecayAnnealing decays over whatever is left -- 55% here --
# so the reference config's behaviour is what this reproduces.
polynomial_power: 2.0
min_lr: 0.000001
# The paper reports 95.7 +/- 0.17, a mean and standard deviation over several
# runs, so a single seed is not directly comparable. Sweep --seed and compare
# the resulting mean/std, not one number.
seed: 0
