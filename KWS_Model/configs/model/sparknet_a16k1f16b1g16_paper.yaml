# SparkNet C=16, gate_channels=16, keeping every pointwise conv and adding a
# DendriticPointwise branch to the pointwise conv of blocks 1: 1 ReLU dendrite(s)
# per neuron, each reading 16 contiguous input channels. Full fan-in: the same shape as a PAI blocks.1 pointwise dendrite, but trained by GD from epoch 0 instead of PB-then-frozen.
# Trained jointly from scratch by gradient descent.
#
# Added 2026-09-27 for the native-dendrite study (batch 11): additive dendrites
# vs simply widening, at equal params. Not a published SparkNet configuration.
family: sparknet
name: sparknet_a16k1f16b1g16_paper
channels: 16
gate_channels: 16
dendrites: 1
dendrite_fan_in: 16
dendrite_mode: add
dendrite_blocks: [1]
sparsity_weight: 1.0
