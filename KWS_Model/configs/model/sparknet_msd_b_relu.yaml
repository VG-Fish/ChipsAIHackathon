# 1999 params (12 classes, input (32, 101)). Budget B (c9g8 = 2023), MSD arm.
# Blocks 1-3 are multi-scale dendritic (MSD) TCS blocks: depthwise at dilations
# 1, 2, 4; C=5 neurons with 3 ReLU branches each, branch j reading a 3-channel
# window of scale j mod 3. blocks.0 stays a plain TCS block: its 3-scale
# depthwise over the 32 MFCC bins alone costs 3*32*11 = 1056 params, which at
# this budget would force C=3 (and C=2 for the dense control).
#
# Added 2026-09-30 for the multi-scale dendrite study. Control at equal params:
# sparknet_msd_b_dense. Not a published SparkNet configuration.
family: sparknet
name: sparknet_msd_b_relu
channels: 5
gate_channels: 8
block_type: msd
msd_dilations: [1, 2, 4]
msd_pointwise: dendritic
msd_branches: 3
msd_fan_in: 3
msd_activation: relu
msd_blocks: [1, 2, 3]
sparsity_weight: 1.0
