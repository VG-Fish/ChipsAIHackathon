# 4160 params (12 classes, input (32, 101)). Budget A ablation: random branch fan-in.
# As dtnet_a_het but layout: random (each branch reads 8 inputs drawn by a seed-0 generator, not a local window).
name: dtnet_a_rnd
family: dtnet
neurons: [34, 34]
fan_in: [8, 8]
tau: hetero
branch_activation: relu
layout: random
branch_norm: true
soma_tau: true
input_transform: idct
input_norm: cmvn
branches: 4
tau_min: 1.0
tau_max: 50.0
dropout: 0.0
