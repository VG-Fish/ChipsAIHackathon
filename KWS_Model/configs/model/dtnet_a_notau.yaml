# 4167 params (12 classes, input (32, 101)). Budget A ablation: no branch temporal dynamics.
# As dtnet_a_het but tau: none on branches (soma leaky integration kept); widths re-tuned to [37, 36].
name: dtnet_a_notau
family: dtnet
neurons: [37, 36]
fan_in: [8, 8]
tau: none
branch_activation: relu
layout: local
branch_norm: true
soma_tau: true
input_transform: idct
input_norm: cmvn
branches: 4
tau_min: 1.0
tau_max: 50.0
dropout: 0.0
