# 1999 params (12 classes, input (32, 101)). Budget B (c9g8 = 2023), linear control.
# sparknet_msd_b_relu with identity branches: the blocks 1-3 pointwise stage is a
# linear, sparse multi-scale mix (MixConv-style) with the exact same wiring and
# parameter count, isolating the per-branch nonlinearity. blocks.0 stays a plain
# TCS block, as in sparknet_msd_b_relu.
#
# Added 2026-09-30 for the multi-scale dendrite study. Not a published SparkNet
# configuration.
family: sparknet
name: sparknet_msd_b_lin
channels: 5
gate_channels: 8
block_type: msd
msd_dilations: [1, 2, 4]
msd_pointwise: dendritic
msd_branches: 3
msd_fan_in: 3
msd_activation: identity
msd_blocks: [1, 2, 3]
sparsity_weight: 1.0
