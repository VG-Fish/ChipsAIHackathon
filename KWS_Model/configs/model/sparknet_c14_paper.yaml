# SparkNet C=14 trained on the paper recipe, the C16 reference narrowed
# with nothing else changed (3,994 learned parameters on MFCC-32 x 101 frames,
# 12 classes, gate_channels=32).  Added 2026-09-19 as a frontier point and
# dendrite base for the accuracy-tier search; not a width the paper reports.
family: sparknet
name: sparknet_c14_paper
channels: 14
gate_channels: 32
# 100 * cross_entropy + 1 * gate_sparsity with the recipe's task_loss_scale: 100.
sparsity_weight: 1.0
