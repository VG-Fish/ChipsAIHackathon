# SparkNet C=10 trained from scratch on the paper recipe -- the C16 reference
# narrowed, not a re-tuned variant. On this project's MFCC-32 frontend
# (32 bins x 101 frames) with 12 classes and gate_channels=32: 2,854 learned
# parameters and 224,806 MACs, measured by building the model, not estimated.
#
# Pairs with configs/train/sparknet_c16_paper.yaml -- SGD momentum 0.9, 200
# epochs, warmup-hold-polynomial. That recipe carries no width-dependent term,
# so the only thing this arm changes against the 4,636-parameter C16 run is the
# block width. Read it against C16's 95.7 +/- 0.17 headline, and remember the
# paper reports a mean and standard deviation over several runs: sweep --seed.
#
# C=10 is the interpolation point the paper does not report; it exists here so
# the from-scratch width curve has a third measurement between C12 and C8
# rather than a straight line drawn through two.
family: sparknet
name: sparknet_c10_paper
channels: 10
# The released checkpoints hard-code 32; see PLAN.md Open questions.
gate_channels: 32
# The upstream objective is 100 * cross_entropy + 1 * gate_sparsity, and the
# training loop forms total = task_loss_scale * CE + sparsity_weight * sparsity.
# The paired paper recipe supplies task_loss_scale: 100, so the sparsity term
# has to carry weight 1.0 here to land on 100:1. The sibling non-paper SparkNet
# model configs (sparknet_c12.yaml, sparknet_c8.yaml) fold the same ratio into
# sparsity_weight: 0.01 against a task scale of 1; pairing one of those with the
# paper recipe would weight the sparsity term 100x too weakly, which is why the
# _paper model configs exist separately.
sparsity_weight: 1.0
