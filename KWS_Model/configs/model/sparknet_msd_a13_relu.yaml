# 4134 params (12 classes, input (32, 101)). Budget A (c16g16 = 4140), MSD arm, blocks 1-3.
# Blocks 1-3 are multi-scale dendritic (MSD) TCS blocks: depthwise at dilations
# 1, 2, 4; C=10 neurons with 3 ReLU branches each, branch j reading a 6-channel
# local window of scale j mod 3, summed by the soma. blocks.0 stays a plain TCS
# block, so the 3-scale block-0 depthwise (3*32*11 = 1056 params) does not push
# C down to 8 as in sparknet_msd_a_relu.
#
# Added 2026-09-30 for the multi-scale dendrite study. Controls at equal params:
# sparknet_msd_a13_lin, sparknet_msd_a13_dense. Not a published SparkNet configuration.
family: sparknet
name: sparknet_msd_a13_relu
channels: 10
gate_channels: 16
block_type: msd
msd_dilations: [1, 2, 4]
msd_pointwise: dendritic
msd_branches: 3
msd_fan_in: 6
msd_activation: relu
msd_blocks: [1, 2, 3]
sparsity_weight: 1.0
