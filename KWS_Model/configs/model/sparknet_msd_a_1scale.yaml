# 4114 params (12 classes, input (32, 101)). Budget A (c16g16 = 4140), single-scale control.
# sparknet_msd_a_relu at one scale (dilation 1): 3 ReLU branches per neuron,
# branch j reading the j-th 6-channel window of the same depthwise output, so
# dendrites without multi-scale. C=15 matches the params; msd_fan_in is 6, not
# the MSD arm's 7, because no width matches 4140 +/- 1.5% with fan-in 7
# (C=14: 4006, C=15: 4294).
#
# Added 2026-09-30 for the multi-scale dendrite study. Not a published SparkNet
# configuration.
family: sparknet
name: sparknet_msd_a_1scale
channels: 15
gate_channels: 16
block_type: msd
msd_dilations: [1]
msd_pointwise: dendritic
msd_branches: 3
msd_fan_in: 6
msd_activation: relu
msd_blocks: [0, 1, 2, 3]
sparsity_weight: 1.0
