# 4176 params (12 classes, input (32, 101)). Budget A ablation: one time constant per neuron shared by its branches.
# As dtnet_a_het but tau: shared (init log-spaced 1..50 across neurons); widths re-tuned to [37, 35] to match params.
name: dtnet_a_shared
family: dtnet
neurons: [37, 35]
fan_in: [8, 8]
tau: shared
branch_activation: relu
layout: local
branch_norm: true
soma_tau: true
input_transform: idct
input_norm: cmvn
branches: 4
tau_min: 1.0
tau_max: 50.0
dropout: 0.0
