# SparkNet C=7 with gate_channels=8 (the paper hard-codes 32), paper recipe.
#
# Added 2026-09-26 for the g8 gate ladder. At narrow widths the
# gate head (gate conv C->G, its BatchNorm, fc G->12) is a third of the model
# and does not shrink with C; this arm narrows it, following the "shrink the
# base, then add dendrites" workflow. Its scratch run is the control for the
# dendritic run of the same config. Not a published SparkNet configuration.
family: sparknet
name: sparknet_c7g8_paper
channels: 7
gate_channels: 8
sparsity_weight: 1.0
