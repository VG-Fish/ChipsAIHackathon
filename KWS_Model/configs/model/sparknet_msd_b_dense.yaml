# 1999 params (12 classes, input (32, 101)). Budget B (c9g8 = 2023), dense control.
# Blocks 1-3 compute the depthwise conv at dilations 1, 2, 4 and mix the
# concatenated 3*C channels with a plain dense 1x1 conv (MixConv-style
# multi-scale, no dendrites); blocks.0 stays a plain TCS block, as in
# sparknet_msd_b_relu, whose params this matches exactly.
#
# Added 2026-09-30 for the multi-scale dendrite study. Not a published SparkNet
# configuration.
family: sparknet
name: sparknet_msd_b_dense
channels: 5
gate_channels: 8
block_type: msd
msd_dilations: [1, 2, 4]
msd_pointwise: dense
msd_blocks: [1, 2, 3]
sparsity_weight: 1.0
