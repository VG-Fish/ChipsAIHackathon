  port_check:
    description: Paper reports 95.7% for C=16. Suspect the port or the front end if C=16 keyword-only
      test accuracy is below 0.90.
    threshold: 0.9
    sparknet_c16_keyword_only_test_accuracy: 0.9415807560137457
    passed: true
  gate_a:
    description: 'Proceed to Phase B if C=16 is clearly above XS under the same harness. Proposed bar:
      >= 90% test accuracy.'
    bar_test_accuracy: 0.9
    sparknet_c16_test_accuracy: 0.8453716690042076
    xs_test_accuracy: 0.8364305750350631
    margin_points: 0.8941093969144442
    meets_bar: false
    note: Overall test accuracy misses the 90% bar because of synthesized silence, not class balance (FAR is
      a rate, so balance does not move it). C=16 labels 451/815 test silence clips as 'up' (silence
      false-accept 0.571 vs XS 0.002). On unknown words it is better than XS (false-accept 0.216 vs 0.368).
      Excluding the silence row, test accuracy is 0.9149 vs XS 0.8096. A gain sweep shows C=16 keeps quiet
      noise as silence (gain <= 0.001 always; 0.1 about 77%) but calls loud noise 'up' (gain 1.0 about 73%;
      pink_noise.wav always). The released checkpoint never saw this project's gain 0.1-1.0 noise as
      silence. Gate A cannot be decided from released checkpoints alone; see the check notes.
