# Codebook learning (framework step 4). Only the centroids are trainable -- a
# few dozen scalars per layer -- so this converges in far fewer epochs than a
# full fine-tune and tolerates a higher learning rate.
augment: true
epochs: 8
cluster_epochs: 8
batch_size: 128
num_workers: 4
persistent_workers: true
prefetch_factor: 2
lr: 0.005
weight_decay: 0.0
label_smoothing: 0.1
warmup_fraction: 0.05
seed: 0

distillation:
  temperature: 1.0
  feature_weight: 0.3
  response_weight: 0.1
  classification_weight: 0.6
