# Framework step 3f: the sweep's stopping rule.
#
# Progressively narrow the base and give each candidate one complete pass
# through steps 3a-3e. The generated `dendritic_prune_w*` runs predate KD
# pre-fine-tuning, the corrected freeze, KD resume, and cost profiling, so they
# are evidence only and are deliberately not reused by this framework run.
#
# The search stops when the *Pareto frontier* stops improving, not at the first
# candidate that loses accuracy: a narrower model that gives up a little
# accuracy but costs less still extends the frontier and is worth having.
# `minimum_validation_accuracy` stays on as an admission constraint -- a model
# below it is not deployable at any cost -- but it no longer ends the sweep.
start_channels: 18
minimum_channels: 4
channel_step: 1
minimum_validation_accuracy: 0.90

# Stop after this many consecutive candidates fail to extend the frontier.
# Candidates rejected by the accuracy floor count toward it too.
pareto_patience: 2

# Ignore measurement noise smaller than these margins when deciding whether a
# candidate materially extends the frontier. Accuracy is absolute; deployment
# costs use a relative tolerance. These keep one-channel/rounded measurements
# from making patience look healthy forever.
pareto_accuracy_tolerance: 0.001
pareto_relative_cost_tolerance: 0.05

# Optional extra admission constraint: reject a candidate that drops more than
# this much accuracy relative to the last admitted one. Leave null while the
# objective is "cheapest model above 90%".
maximum_accuracy_drop: null

# The fixed teacher for every KD term inside the sweep (steps 3b and 3d).
teacher_checkpoint: models/checkpoints/ds_cnn_l_12class.pt

reuse_completed_start_run: null
reuse_completed_candidates: true
save_prefix: dendritic_framework
summary_path: reports/dendritic_framework_prune_loop.yaml
