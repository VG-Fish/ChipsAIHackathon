# Progressively narrow the XS base and give each candidate one complete,
# dynamically terminated PerforatedAI cycle. Width 18 reuses the completed
# cycle-1 run; new training begins at width 17. The first candidate below 90%
# validation accuracy ends the search, preserving the previous accepted model.
start_channels: 18
minimum_channels: 4
channel_step: 1
minimum_validation_accuracy: 0.90

# Leave null while the real objective is "smallest model above 90%". Set a
# decimal value (for example 0.005) to also stop on a relative accuracy drop.
maximum_accuracy_drop: null

reuse_completed_start_run: dendritic_xxs_cycle1
save_prefix: dendritic_prune
summary_path: reports/dendritic_prune_loop.yaml
