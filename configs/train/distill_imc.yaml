# Controlled Large -> XS distillation experiment. This retains the baseline
# data pipeline and optimizer while adopting the three losses and weights from
# Song et al., "Knowledge Distillation for In-Memory Keyword Spotting Model."
augment: true
epochs: 40
batch_size: 128
num_workers: 4
persistent_workers: true
prefetch_factor: 2
lr: 0.001
weight_decay: 0.0001
label_smoothing: 0.1
warmup_fraction: 0.05
seed: 0

distillation:
  temperature: 1.0
  feature_weight: 0.3
  response_weight: 0.1
  classification_weight: 0.6
