# DS-CNN-XS: sized to land near the ~3,800-parameter Edge Impulse reference
# point for a 12-way task (10 target keywords + unknown + silence).
# Actual parameter count: 4,096 for 12 classes,
# input (40, 98). Re-measure if target_keywords/num_classes changes.
name: ds_cnn_xs
initial_channels: 18
initial_kernel: 5
initial_stride: 2
block_channels: [40, 40]
dropout: 0.2
