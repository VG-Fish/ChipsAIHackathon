# Google Speech Commands v2 data configuration.
dataset:
  url: "http://download.tensorflow.org/data/speech_commands_v0.02.tar.gz"
  md5: "6b74f3901214cb2c2934e98196829835"
  root: "data/raw/speech_commands_v0.02"
  sample_rate: 16000
  clip_seconds: 1.0

# Target keywords are the "real" classes. Any subset of the 35-word vocabulary
# works here -- everything else becomes the pooled "unknown" class.
target_keywords: ["yes", "no", "on", "off"]

unknown:
  # Words pooled into "unknown" = all v2 words minus target_keywords.
  # Capped per-epoch to ~this multiple of the average target-keyword sample
  # count, since the leftover-word pool has far more raw samples.
  max_ratio_to_avg_keyword_count: 2.5

silence:
  background_noise_dir: "_background_noise_"
  # Fraction of an epoch's samples that should be synthesized silence clips.
  fraction_of_epoch: 0.1
  min_gain: 0.1
  max_gain: 1.0

features:
  type: "logmel"  # logmel | mfcc
  n_mels: 40
  win_length_ms: 30
  hop_length_ms: 10

splits:
  testing_list: "testing_list.txt"
  validation_list: "validation_list.txt"
